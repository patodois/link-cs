name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build (the library targets netstandard2.0, the tests and the demo net8.0)
        run: dotnet build RewriteLink.sln -c Release
      - name: Tests
        run: dotnet run --project tests/RewriteLink.Tests -c Release --no-build
      - name: Demo host and guest against each other (pixel file with depth, 400-chunk collision snapshot)
        if: runner.os != 'Windows'
        run: tests/interop.sh cs
        env:
          RBL_CS_DLL: demo/LinkDemo/bin/Release/net8.0/LinkDemo.dll

  # Game files, decompiled or third-party code and secrets must never reach this public repository: this runs
  # tools/check_public_tree.py on the commits of the push or pull request (a new branch: all of its history).
  public-tree:
    name: Public tree (no game files, decompiled code or secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the commits of this push or pull request
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            python3 tools/check_public_tree.py --range "$BASE..$HEAD"
          else
            python3 tools/check_public_tree.py --range "$HEAD"
          fi
