name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build (the library targets netstandard2.0, the tests and the demo net8.0)
        run: dotnet build RewriteLink.sln -c Release
      - name: Tests
        run: dotnet run --project tests/RewriteLink.Tests -c Release --no-build
      - name: Demo host and guest against each other (pixel file with depth, 400-chunk collision snapshot)
        if: runner.os != 'Windows'
        run: tests/interop.sh cs
        env:
          RBL_CS_DLL: demo/LinkDemo/bin/Release/net8.0/LinkDemo.dll
